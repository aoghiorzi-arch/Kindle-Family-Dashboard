# Cloudflare Worker configuration. Local development only until a production account and sign-in provider are approved (ADR D2).
name = "kfd-api"
main = "../../apps/api/src/worker.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "kfd"
database_id = "local-development-only"
migrations_dir = "migrations"

[vars]
# Set in the production dashboard or via `wrangler secret`, never committed.
# Local development values come from infrastructure/cloudflare/.dev.vars (git-ignored).

# The family editor is static. Serving it from the same Worker keeps it on one origin with the API,
# which the cookie and CSRF rules depend on. Requests under /api always reach the Worker.
[assets]
directory = "../../apps/family-web"
binding = "ASSETS"
