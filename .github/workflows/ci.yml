name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python prototype tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  api:
    name: Cloudflare Worker typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: apps/api
        run: npm ci
      - working-directory: apps/api
        run: npm run typecheck
      - working-directory: apps/api
        run: npm test
      - name: Migration applies to an empty database
        run: |
          node -e "const {DatabaseSync}=require('node:sqlite');const db=new DatabaseSync(':memory:');db.exec(require('fs').readFileSync('infrastructure/cloudflare/migrations/0001_init.sql','utf8'));console.log('migration ok')"
