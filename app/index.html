<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Hub · Local</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#252522;background:#f4f3ee}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header{padding:18px 20px;border-bottom:1px solid #dddcd3;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:23px;margin:0}small,.sub{color:#666}main{display:grid;grid-template-columns:minmax(280px,420px) minmax(320px,620px);gap:32px;max-width:1120px;margin:32px auto;padding:0 18px}.panel{background:white;border:1px solid #e0ddd5;border-radius:12px;padding:24px;margin-bottom:16px}h2{font-size:18px;margin:0 0 12px}p{line-height:1.5}form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}input{flex:1;min-width:145px;padding:12px;border:1px solid #aaa;border-radius:7px;font-size:16px}button{background:#232522;color:white;padding:12px 18px;border:0;border-radius:7px;cursor:pointer;font-weight:600}button:hover{background:#444}button.link{background:none;color:#375b38;padding:4px 6px;font-weight:600;text-decoration:underline}button.link.danger{color:#8a2b2b}.status{min-height:22px;color:#375b38;font-size:14px}.status.error{color:#8a2b2b}.check{flex:none;display:flex;align-items:center;gap:6px;font-size:14px;color:#555}.check input{flex:none;min-width:0}img{display:block;width:100%;height:auto;border:1px solid #ddd;box-shadow:0 12px 42px #0001}.preview{max-width:600px}.preview p{font-size:13px;color:#65635d}ul{padding-left:0;list-style:none;margin:0}li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee}li.done span{color:#888;text-decoration:line-through}.login{max-width:420px;margin:48px auto}label{font-size:13px;color:#555;display:block;margin-bottom:5px}.login form{flex-direction:column;align-items:stretch}@media(max-width:800px){main{display:flex;flex-direction:column-reverse;margin-top:16px;gap:16px}.preview{max-width:460px;margin:auto}.panel{padding:16px}}
</style></head>
<body><header><div><h1>Family Hub <small>· Local</small></h1><div class="sub">A calm family display, designed for the Kindle Touch.</div></div><div id="account" hidden><span id="who"></span> · <button class="link" id="logout">Sign out</button></div></header>
<section id="login" class="panel login" hidden><h2>Sign in</h2><form id="loginForm"><label for="username">Username</label><input id="username" autocomplete="username" required maxlength="32"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form><p id="loginStatus" class="status" role="status" aria-live="polite"></p></section>
<main id="app" hidden><section>
<div class="panel"><h2>Shopping list</h2><form id="shopping"><input id="item" maxlength="100" placeholder="Add a shopping item" required aria-label="Shopping item"><button>Add item</button></form><ul id="items"></ul></div>
<div class="panel"><h2>Family events</h2><form id="event"><input id="eventTitle" maxlength="100" placeholder="Event name" required aria-label="Event name"><input id="eventTime" placeholder="Time (e.g. 17:30)" maxlength="30" aria-label="Event time"><label class="check"><input type="checkbox" id="eventPrivate"> Private (shows as “Busy” on the display)</label><button>Add event</button></form><ul id="events"></ul></div>
<div class="panel"><p id="status" class="status" role="status" aria-live="polite"></p><a href="/frame.png" target="_blank" rel="noopener">Open full-size PNG preview</a></div>
</section><section class="preview"><img id="screen" width="600" height="800" alt="600 by 800 monochrome family board preview"><p>Updated after each successful edit · Not connected to a Kindle</p></section></main>
<script src="/static/app.js"></script></body></html>
